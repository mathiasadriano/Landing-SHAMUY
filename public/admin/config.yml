backend:
  name: github
  repo: mathiasadriano/Landing-SHAMUY
  branch: main
  base_url: /
  auth_endpoint: auth

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "configuracion_web"
    label: "Configuración y Secciones Fijas"
    files:
      - label: "Página Principal (Textos Base)"
        name: "inicio"
        file: "public/contenido.json"
        fields:
          - {label: "Tagline", name: "hero_tagline", widget: "string"}
          - {label: "Título Principal", name: "hero_titulo", widget: "string"}
          - {label: "Descripción Principal", name: "hero_descripcion", widget: "text"}
          - {label: "Imagen de Portada", name: "hero_img", widget: "image"}
          - {label: "Texto Botón 1", name: "hero_btn_texto", widget: "string"}
          - {label: "Link Botón 1", name: "hero_btn_link", widget: "string"}
          - {label: "Texto Botón 2", name: "hero_btn2_texto", widget: "string"}
          - {label: "Link Botón 2", name: "hero_btn2_link", widget: "string"}
          - label: "Indicadores de Impacto (KPIs)"
            name: "kpis"
            widget: "list"
            fields:
              - {label: "Valor", name: "valor", widget: "string"}
              - {label: "Descripción", name: "desc", widget: "string"}
          - {label: "Texto Visión/Misión", name: "nosotros_texto", widget: "text"}
          - label: "Logos de Aliados"
            name: "aliados"
            widget: "list"
            fields:
              - {label: "Nombre del Aliado", name: "nombre", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image"}

  - name: "noticias"
    label: "Noticias y Proyectos"
    files:
      - label: "Lista de Noticias"
        name: "lista_noticias"
        file: "public/noticias.json" 
        fields:
          - label: "Noticias Publicadas"
            name: "items"
            widget: "list"
            fields:
              - {label: "Título", name: "title", widget: "string"}
              - {label: "Categoría", name: "categoria", widget: "string"}
              - {label: "Descripción Corta", name: "descripcion", widget: "text"}
              - {label: "Imagen", name: "imagen", widget: "image"}
              - {label: "Enlace", name: "enlace", widget: "string"}